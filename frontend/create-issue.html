<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect — New Issue</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar rendered by ui.js -->
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container" style="max-width: 600px;">
      <div class="page-header">
        <div>
          <h1 class="page-title">Report a New Issue</h1>
          <p class="text-muted" style="margin-top: 4px; margin-bottom: 0;">Tell us what is wrong on campus. It takes under a minute.</p>
        </div>
      </div>

      <!-- Banner message for general form success / error -->
      <div id="form-message" class="message-box" role="alert"></div>

      <form id="issue-form" class="card" novalidate>
        <div class="form-group" id="field-title">
          <label for="title" class="form-label">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            class="form-control"
            required
            minlength="3"
            maxlength="100"
            placeholder="e.g. Projector not turning on"
            autocomplete="off"
            aria-describedby="title-error"
          >
          <div id="title-error" class="field-error" aria-live="polite"></div>
        </div>

        <div class="form-group" id="field-category">
          <label for="category" class="form-label">Category</label>
          <select
            id="category"
            name="category"
            class="form-control"
            required
            disabled
            aria-describedby="category-error"
          >
            <option value="">Loading categories…</option>
          </select>
          <div id="category-error" class="field-error" aria-live="polite"></div>
        </div>

        <div class="form-group" id="field-description">
          <label for="description" class="form-label">Description</label>
          <textarea
            id="description"
            name="description"
            class="form-control"
            required
            minlength="10"
            maxlength="1000"
            placeholder="Describe the problem: where it is and what is happening."
            aria-describedby="description-error description-count"
          ></textarea>
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-top: 4px;">
            <div id="description-error" class="field-error" aria-live="polite" style="margin-top: 0;"></div>
            <span class="field-hint" id="description-count" aria-live="polite" style="margin-left: auto;">0 / 1000</span>
          </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button type="submit" id="submit-button" class="btn btn-primary" style="flex: 1;" disabled>Create Issue</button>
          <a href="dashboard.html" class="btn btn-outline" style="flex: 1;">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>CampusConnect · College Issue Reporting System</p>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/create-issue.js"></script>
</body>
</html>
