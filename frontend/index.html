<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect — Login & Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="card auth-card">
      <header class="auth-header">
        <h1 class="auth-brand">CampusConnect</h1>
        <p class="auth-subtitle">Campus Issue Reporting for Students</p>
      </header>

      <!-- Auth Tabs: Login / Register (spec.md section 7.1) -->
      <nav class="auth-tabs" role="tablist" aria-label="Authentication Options">
        <button
          type="button"
          id="tab-login"
          class="auth-tab active"
          role="tab"
          aria-selected="true"
          aria-controls="login-panel"
        >
          Log In
        </button>
        <button
          type="button"
          id="tab-register"
          class="auth-tab"
          role="tab"
          aria-selected="false"
          aria-controls="register-panel"
        >
          Register
        </button>
      </nav>

      <!-- LOGIN FORM PANEL -->
      <section id="login-panel" role="tabpanel" aria-labelledby="tab-login">
        <div id="login-message" class="message-box" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email" class="form-label">Email Address</label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="form-control"
              placeholder="name@college.edu"
              autocomplete="email"
              required
            >
            <div id="login-email-error" class="field-error" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <div id="login-password-error" class="field-error" aria-live="polite"></div>
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block">
            Log In
          </button>
        </form>
      </section>

      <!-- REGISTER FORM PANEL -->
      <section id="register-panel" role="tabpanel" aria-labelledby="tab-register" style="display: none;">
        <div id="register-message" class="message-box" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="register-name" class="form-label">Full Name</label>
            <input
              type="text"
              id="register-name"
              name="full_name"
              class="form-control"
              placeholder="e.g. Asha Rao"
              autocomplete="name"
              required
            >
            <div id="register-name-error" class="field-error" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="register-email" class="form-label">Email Address</label>
            <input
              type="email"
              id="register-email"
              name="email"
              class="form-control"
              placeholder="name@college.edu"
              autocomplete="email"
              required
            >
            <div id="register-email-error" class="field-error" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="register-password" class="form-label">Password</label>
            <input
              type="password"
              id="register-password"
              name="password"
              class="form-control"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              required
            >
            <div id="register-password-error" class="field-error" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="register-confirm-password" class="form-label">Confirm Password</label>
            <input
              type="password"
              id="register-confirm-password"
              name="confirm_password"
              class="form-control"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            >
            <div id="register-confirm-password-error" class="field-error" aria-live="polite"></div>
          </div>

          <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block">
            Create Account
          </button>
        </form>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <p>CampusConnect · College Issue Reporting System</p>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
