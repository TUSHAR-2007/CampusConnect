<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect — Issue Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Bar rendered by ui.js -->
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container" style="max-width: 800px;">
      <a href="dashboard.html" class="btn btn-outline btn-sm" style="margin-bottom: 20px; display: inline-flex; align-items: center; gap: 6px;">← Back to Dashboard</a>

      <!-- Page Level Alert / Error / Loading Messages -->
      <div id="issue-message" class="message-box" role="alert" aria-live="polite"></div>

      <!-- Main Issue Detail Card -->
      <div id="issue-detail-container" style="display: none;">
        <article class="card" style="padding: 24px;">
          <!-- Header: Title and Status Badge -->
          <header style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;">
              <div style="flex: 1; min-width: 240px;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                  <span id="issue-id-tag" style="font-weight: 700; color: var(--color-muted); font-size: 0.9375rem;"></span>
                  <span id="issue-category-container"></span>
                </div>
                <h1 id="issue-title" class="page-title" style="margin: 0; word-break: break-word;"></h1>
              </div>
              <div id="issue-status-badge-container"></div>
            </div>
          </header>

          <!-- Metadata Bar: Reporter & Dates -->
          <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 16px; background-color: var(--color-bg); border-radius: var(--radius-input); font-size: 0.875rem; color: var(--color-muted); margin-bottom: 24px;">
            <span>Reported by: <strong id="issue-reporter" style="color: var(--color-text);"></strong></span>
            <span>Submitted: <strong id="issue-created" style="color: var(--color-text);"></strong></span>
            <span id="issue-updated-wrapper">Last updated: <strong id="issue-updated" style="color: var(--color-text);"></strong></span>
          </div>

          <!-- Description Section -->
          <section aria-labelledby="desc-heading" style="margin-bottom: 28px;">
            <h2 id="desc-heading" style="font-size: 1.125rem; font-weight: 600; margin-bottom: 8px;">Description</h2>
            <div id="issue-description" style="background-color: #FFFFFF; border: 1px solid var(--color-border); border-radius: var(--radius-input); padding: 16px; font-size: 0.9375rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--color-text);"></div>
          </section>

          <!-- Status Update Section -->
          <section aria-labelledby="status-heading" style="border-top: 1px solid var(--color-border); padding-top: 20px;">
            <h2 id="status-heading" style="font-size: 1.125rem; font-weight: 600; margin-bottom: 12px;">Update Status</h2>
            <form id="status-update-form">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px;">
                <label for="status-select" class="form-label" style="margin: 0; min-width: 60px;">Status:</label>
                <select id="status-select" class="form-control" style="width: auto; min-width: 180px;" aria-label="Select issue status">
                  <option value="Open">Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                </select>
                <button type="submit" id="update-status-btn" class="btn btn-primary">Update Status</button>
              </div>
              <!-- Status Update Feedback (Success / Error) -->
              <div id="status-update-feedback" class="message-box" role="alert" aria-live="polite"></div>
            </form>
          </section>
        </article>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>CampusConnect · College Issue Reporting System</p>
  </footer>

  <!-- Core Scripts -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/issue.js"></script>
</body>
</html>
