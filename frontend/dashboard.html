<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Bar rendered by ui.js -->
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">Campus Issues</h1>
          <p class="text-muted" style="margin-top: 4px; margin-bottom: 0;">Browse and track reported campus issues</p>
        </div>
        <div class="page-actions">
          <a href="create-issue.html" class="btn btn-primary" id="new-issue-btn">+ New Issue</a>
        </div>
      </div>

      <!-- Alert / Status / Error message container -->
      <div id="dashboard-message" class="message-box" role="alert" aria-live="polite"></div>

      <!-- Grid listing submitted issues -->
      <section id="issues-container" class="grid" aria-label="Campus issues list">
        <!-- Issues cards or empty state inserted dynamically by dashboard.js -->
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>CampusConnect · College Issue Reporting System</p>
  </footer>

  <!-- Core Scripts -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
